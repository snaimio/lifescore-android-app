# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# Allocates 4GB heap space to Gradle Daemon to prevent OutOfMemoryError in D8/Dexer and Kotlin compiler
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Explicit Java Home pointing to installed OpenJDK 21
org.gradle.java.home=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

# Enable parallel and cached builds for faster compilation
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX support and namespacing
android.useAndroidX=true
android.nonTransitiveRClass=true

# Incremental KSP processing
ksp.incremental=true

# Enable 16 KB page size support
android.native.16kb.enabled=true


# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
