<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeScore - Legal & Privacy Center</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --gold: #ffd700;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 90%;
            margin: 40px auto;
            text-align: center;
        }
        .card {
            background-color: var(--surface);
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid var(--border);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 12px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 32px;
        }
        .links-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .nav-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .nav-card:hover {
            background: rgba(99, 102, 241, 0.12);
            border-color: var(--primary);
            transform: translateY(-2px);
        }
        .nav-left {
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
        }
        .nav-icon {
            font-size: 1.6rem;
        }
        .nav-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #ffffff;
        }
        .nav-desc {
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .arrow {
            color: var(--primary);
            font-size: 1.3rem;
            font-weight: bold;
        }
        footer {
            margin-top: 36px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">⚡</div>
            <h1>LifeScore Legal Center</h1>
            <p class="subtitle">Gamify your habits. Own your data.</p>

            <div class="links-grid">
                <a href="/privacy" class="nav-card">
                    <div class="nav-left">
                        <span class="nav-icon">🛡️</span>
                        <div>
                            <div class="nav-title">Privacy Policy</div>
                            <div class="nav-desc">GDPR, CCPA & COPPA compliance disclosures</div>
                        </div>
                    </div>
                    <span class="arrow">→</span>
                </a>

                <a href="/terms" class="nav-card">
                    <div class="nav-left">
                        <span class="nav-icon">📑</span>
                        <div>
                            <div class="nav-title">Terms of Service</div>
                            <div class="nav-desc">Usage policies, AI disclaimers & billing rules</div>
                        </div>
                    </div>
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>
        <footer>
            &copy; 2026 LifeScore Technologies Inc. All rights reserved.
        </footer>
    </div>
</body>
</html>
